
<!DOCTYPE html>
<html>
<head>
    <title>Class Timetable</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background-color: white;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
        }

        th {
            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>Class Timetable</h1>

    <table>
        <tr>
            <th>Day</th>
            <th>Time Slot</th>
            <th>Subject</th>
            <th>Faculty Name</th>
            <th>Classroom</th>
        </tr>

        {% for slot in slots %}
        <tr>
            <td>{{ slot.day }}</td>
            <td>{{ slot.start_time }} - {{ slot.end_time }}</td>
            <td>{{ slot.subject_name }}</td>
            <td>{{ slot.faculty_name }}</td>
            <td>{{ slot.classroom }}</td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="5">No timetable records available.</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
